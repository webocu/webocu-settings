name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings widget → About, or the release you installed.
      placeholder: "0.3.2"
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model and webOS version
      placeholder: "model, webOS 6.x"
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: How is the app installed
      options:
        - Developer Mode
        - Rooted (webosbrew), helper service elevated to root
        - Rooted (webosbrew), helper service without root
        - Desktop browser (make dev)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output or the relevant lines of the TV log. Remove addresses, keys and passwords first.
      render: text
